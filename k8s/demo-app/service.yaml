apiVersion: v1
kind: Service
metadata:
  name: incident-demo
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: incident-demo
    app.kubernetes.io/part-of: incident-ai
spec:
  selector:
    app.kubernetes.io/name: incident-demo
  ports:
    # Named port: the Prometheus ServiceMonitor refers to it as "http".
    - name: http
      port: 80
      targetPort: http
