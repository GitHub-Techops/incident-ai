apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-demo
  namespace: incident-lab
  labels:
    app.kubernetes.io/name: incident-demo
    app.kubernetes.io/part-of: incident-ai
spec:
  replicas: 2
  # Old ReplicaSets kept for `kubectl rollout undo` (Milestone 17).
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-demo
        app.kubernetes.io/part-of: incident-ai
        app.kubernetes.io/version: v1
    spec:
      containers:
        - name: incident-demo
          image: incident-demo:v1
          # Use the image loaded with `kind load`; never pull from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: incident-demo-config
          # /health is shallow on purpose: it stays green during the FAIL_MODE
          # incident, so only metrics and logs reveal the problem.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
