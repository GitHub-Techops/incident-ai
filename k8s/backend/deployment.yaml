apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-backend
  namespace: incident-ai
  labels:
    app.kubernetes.io/name: incident-backend
    app.kubernetes.io/part-of: incident-ai
spec:
  # Exactly 1: incidents are kept in memory until PostgreSQL is added.
  # A second replica would have its own separate incident list.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-backend
        app.kubernetes.io/part-of: incident-ai
        app.kubernetes.io/version: 0.4.0
    spec:
      # Identity for the Kubernetes API: read-only (get/list) in incident-lab
      # only. See rbac.yaml.
      serviceAccountName: incident-backend
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10001  # makes the git volume writable for the app user
      volumes:
        - name: git
          persistentVolumeClaim:
            claimName: incident-backend-git
      containers:
        - name: incident-backend
          image: incident-backend:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
            # App-level allow-list; must stay in line with the RBAC in rbac.yaml.
            - name: ALLOWED_NAMESPACES
              value: incident-lab
            - name: PROMETHEUS_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring:9090
            # Git history, copied in by scripts/sync-git-mirror.sh.
            - name: GIT_SOURCE
              value: /data/git/incident-ai.bundle
            - name: GIT_CACHE_DIR
              value: /data/git/cache.git
            - name: GIT_SERVICE_PATHS
              value: incident-demo=demo-app
            - name: METRICS_LOOKBACK_MINUTES
              value: "10"
          volumeMounts:
            - name: git
              mountPath: /data/git
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
